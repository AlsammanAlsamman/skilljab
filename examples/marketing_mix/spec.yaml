# The miniature: a weekly marketing table (one row per region-week) with a planted truth about
# what each channel returns per dollar.
generator: tabular_regression
n: 600
seed: 11
sizes: [1, 3, 10]
target_n: 500000        # a retailer's store-day table
features:
  numeric:
    tv_spend:     {mean: 50, sd: 20, min: 0}      # $k per week
    search_spend: {mean: 30, sd: 12, min: 0}
    social_spend: {mean: 20, sd: 10, min: 0}
    email_sends:  {mean: 40, sd: 15, min: 0, integer: true}   # thousands of emails
    discount_pct: {mean: 10, sd: 5,  min: 0}
  categorical:
    region:  [north, south, west]
    quarter: [q1, q2, q3, q4]
truth:
  outcome: revenue
  intercept: 200
  noise_sd: 40
  effects:
    tv_spend:     2.5     # $2.50 back per $1 of TV
    search_spend: 4.0     # search is the best channel
    social_spend: 1.5
    email_sends:  0.5
    discount_pct: 3.0     # each point of discount adds $3k revenue
tolerance: {relative: 0.25, absolute: 0.1}
