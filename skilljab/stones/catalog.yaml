# Generic stones. Domain-neutral on purpose: the LLM's own knowledge does the specialization
# once a stone produces a silent failure. `wakeup_hint` is shown only AFTER a silent failure.
stones:
  - id: correlated_block
    character: The Clique
    applies_to: [tabular, genotype, timeseries]
    dose: {n_copies: [2, 8], rho: [0.85, 0.99]}
    symptom: "one block of near-identical features dominates; coefficients split or explode; PCA collapses onto the block"
    wakeup_hint: "dense structure in the data that the method assumes is absent (think: a region where everything is correlated)"

  - id: mnar_missing
    character: The Ghost
    applies_to: [tabular, timeseries]
    dose: {frac: [0.05, 0.30]}
    symptom: "rows vanish preferentially where values are extreme; estimates shift toward the middle"
    wakeup_hint: "missingness that depends on the value itself, so dropping rows biases everything downstream"

  - id: duplicates
    character: The Twin
    applies_to: [tabular, genotype]
    dose: {frac: [0.05, 0.40]}
    symptom: "n inflates; point estimates unchanged but uncertainty shrinks; p-values too small"
    wakeup_hint: "the same observation counted more than once (re-uploads, joins, technical replicates)"

  - id: outliers
    character: The Spike
    applies_to: [tabular, timeseries]
    dose: {frac: [0.005, 0.05], scale: [5, 30]}
    symptom: "a few extreme points drag means and slopes; residual plots show a lone cluster"
    wakeup_hint: "a handful of impossible values (unit slip, sensor glitch, typo) that a squared-error method cannot ignore"

  - id: batch_shift
    character: The Drifter
    applies_to: [tabular, timeseries, genotype]
    dose: {frac: [0.2, 0.5], shift: [1.0, 4.0]}
    symptom: "a subgroup has a different baseline; effect estimates absorb the group difference"
    wakeup_hint: "an unmodelled batch/plate/site/time effect that is confounded with the exposure"

  - id: measurement_error
    character: The Blur
    applies_to: [tabular, timeseries]
    dose: {sd: [0.3, 1.5]}
    symptom: "effects attenuate toward zero; nothing crashes, everything looks a bit weaker"
    wakeup_hint: "noise in a predictor (errors-in-variables) biases its coefficient toward zero"

  - id: target_leakage
    character: The Time Traveler
    applies_to: [tabular, timeseries]
    dose: {noise_sd: [0.05, 0.5]}
    symptom: "one feature predicts the outcome almost perfectly; all other effects shrink toward zero"
    wakeup_hint: "a column computed from the outcome, or from the future, leaked into the predictors"

  - id: unit_mix
    character: The Metric Martian
    applies_to: [tabular]
    dose: {frac: [0.05, 0.3], factor: [10, 1000]}
    symptom: "a feature has two populations of magnitudes; its coefficient becomes tiny and noisy"
    wakeup_hint: "the same quantity recorded in two different units (mg vs g, cm vs inches, hg19 vs hg38 coordinates)"

  - id: heavy_tails
    character: The Long Tail
    applies_to: [tabular, timeseries]
    dose: {df_t: [1.5, 4.0]}
    symptom: "estimates are unbiased on average but wildly variable; one rerun differs from the next"
    wakeup_hint: "noise with heavy tails; least-squares and normal-theory intervals are not robust to it"

  - id: rare_category
    character: The Unicorn
    applies_to: [tabular]
    dose: {n_rows: [1, 3]}
    symptom: "the pipeline crashes on a level it never saw, or one-hot encoding yields a column of almost all zeros"
    wakeup_hint: "a category level with almost no support; encoders, stratified splits, and group-wise stats all choke on it"

  - id: type_corruption
    character: The Typo
    applies_to: [tabular]
    dose: {frac: [0.01, 0.1]}
    symptom: "a numeric column arrives as text ('1,234', ' 12 ', 'NA'); parsers coerce silently or crash"
    wakeup_hint: "mixed types in one column (thousands separators, whitespace, sentinel strings) from a spreadsheet export"
